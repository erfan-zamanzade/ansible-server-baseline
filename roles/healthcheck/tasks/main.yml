---
- name: Install the health-check script
  ansible.builtin.copy:
    src: server-healthcheck
    dest: /usr/local/bin/server-healthcheck
    owner: root
    group: root
    mode: "0755"

- name: Write the health-check configuration
  ansible.builtin.template:
    src: server-healthcheck.conf.j2
    dest: /etc/server-healthcheck.conf
    owner: root
    group: root
    mode: "0644"

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - server-healthcheck.service
    - server-healthcheck.timer
  notify: Reload systemd

- name: Load unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: server-healthcheck.timer
    enabled: true
    state: started
