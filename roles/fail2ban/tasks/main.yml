---
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      # Journal backend: sshd logs to journald, there is no auth.log to tail.
      - python3-systemd
    state: present

- name: Configure fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/90-baseline.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# Drop instead of reject: a banned scanner sees a dead port rather than a
# reset that confirms the host is there.
- name: Drop packets from banned addresses
  ansible.builtin.copy:
    dest: /etc/fail2ban/action.d/nftables.local
    content: |
      # Managed by Ansible (fail2ban role).
      [Init]
      blocktype = drop
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Apply configuration changes before checking the jail
  ansible.builtin.meta: flush_handlers

- name: Check the sshd jail is running
  ansible.builtin.command: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  retries: 10
  delay: 2
  until: fail2ban_sshd_status.rc == 0
