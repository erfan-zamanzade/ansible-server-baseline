---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# The packaged unit runs `nft flush ruleset` on stop, which would also wipe
# the rules Docker and fail2ban keep in their own tables. Only touch ours.
- name: Create the nftables unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make nftables stop/reload touch only the baseline table
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/baseline.conf
    content: |
      # Managed by Ansible (firewall role).
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet baseline
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewall

- name: Write the ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload firewall

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true
