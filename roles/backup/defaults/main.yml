---
# restic repository. A local path is fine for the tests but is not a backup:
# point this at off-site storage (sftp:, s3:, rest:) in a real inventory and
# put the credentials in backup_restic_env.
backup_restic_repository: /var/backups/restic
# Required, no default. Keep it in Ansible Vault and store a copy outside
# the server: without it the backups cannot be read.
# backup_restic_password:
# Extra environment for restic, e.g. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
backup_restic_env: {}

backup_paths:
  - /etc
  - /srv/app
backup_excludes:
  - /etc/ssh/ssh_host_*_key

# PostgreSQL databases dumped with pg_dump inside their container.
#   - container: app-postgres-1
#     database: app
#     user: app
#     # Restore verification: this query runs against the restored copy and
#     # must return a number >= verify_min.
#     verify_sql: SELECT count(*) FROM migrations
#     verify_min: 1
backup_postgres: []

backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

backup_schedule: "*-*-* 02:30:00"
backup_verify_schedule: "Sun *-*-* 05:00:00"
# Share of the repository data read back during `restic check` in verification.
backup_verify_read_data_subset: 10%

backup_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"

# Internal: the environment the role uses when it calls restic itself.
backup_restic_environment: >-
  {{ {'RESTIC_REPOSITORY': backup_restic_repository,
      'RESTIC_PASSWORD_FILE': '/etc/restic/password',
      'RESTIC_CACHE_DIR': '/var/cache/restic'} | combine(backup_restic_env) }}
