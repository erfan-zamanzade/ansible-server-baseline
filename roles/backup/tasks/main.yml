---
- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/restic
    - /etc/backup
    - /var/cache/restic

- name: Write the restic password
  ansible.builtin.copy:
    dest: /etc/restic/password
    content: "{{ backup_restic_password }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the restic environment
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic/env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the backup configuration
  ansible.builtin.template:
    src: backup.conf.j2
    dest: /etc/backup/backup.conf
    owner: root
    group: root
    mode: "0600"

- name: Create the script library directory
  ansible.builtin.file:
    path: /usr/local/lib/server-baseline
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the shared helpers
  ansible.builtin.copy:
    src: backup-common.sh
    dest: /usr/local/lib/server-baseline/backup-common.sh
    owner: root
    group: root
    mode: "0644"

- name: Install the backup scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - backup-run
    - backup-verify
    - backup-restore-db

- name: Check whether the repository exists
  ansible.builtin.command: restic cat config
  environment: "{{ backup_restic_environment }}"
  register: backup_repo_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Initialise the repository
  ansible.builtin.command: restic init
  environment: "{{ backup_restic_environment }}"
  when: backup_repo_check.rc != 0
  changed_when: true
  no_log: true

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - backup.service
    - backup.timer
    - backup-verify.service
    - backup-verify.timer
  notify: Reload systemd

- name: Load unit changes before enabling the timers
  ansible.builtin.meta: flush_handlers

- name: Enable the timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - backup.timer
    - backup-verify.timer
