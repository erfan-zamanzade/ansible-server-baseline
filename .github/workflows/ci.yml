---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (yamllint, ansible-lint, shellcheck, promtool, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: scripts/install-tools.sh

      - name: Static checks
        run: scripts/lint.sh

  molecule:
    name: Molecule ${{ matrix.scenario }} on ${{ matrix.distro }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [hardening, site]
        distro: [debian13, ubuntu2404, ubuntu2604]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: scripts/install-tools.sh

      - name: Converge, idempotence and verify
        run: scripts/molecule.sh "$SCENARIO" "$DISTRO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
